<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>鬼滅の刃</title>
</head>
<body>

  <!-- ローディング画面 -->
  <div class="spinner loaded"></div>
  <div class="load loaded"></div>

  <div class="wrap">

  <!-- 表示画面 -->
  <header>
    <h1>鬼滅の刃 キャラクター一覧</h1>
  </header>

  <div class="buttons">
    <label class="button"><input type="radio" name="choice" value="all" checked>全キャラクター</label>
    <label class="button"><input type="radio" name="choice" value="kisatsutai">鬼殺隊</label>
    <label class="button"><input type="radio" name="choice" value="hashira">柱</label>
    <label class="button"><input type="radio" name="choice" value="oni">鬼</label>
  </div>


  <div class="container">
    <ul id="js-list" class="list-container">
      <!-- ここにキャラクターを表示 -->
    </ul>
  </div>

  <!-- エラーメッセージを表示 -->
  <div class="container">
    <p class="error-msg"></p>
  </div>

  <footer>
    2025 JavaScript practice
  </footer>

  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
